<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home open campaigns — one-row arrows fix</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #f8fafc 0%, #fff 45%, #eff6ff 100%);
    color: #0f172a;
  }
  .wrap { max-width: 80rem; margin: 0 auto; padding: 2.5rem 1.5rem 3rem; }
  @media (min-width: 1536px) { .wrap { max-width: 1536px; } }
  .eyebrow {
    display: inline-flex; padding: 0.25rem 0.75rem; border-radius: 999px;
    font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    background: #eff6ff; color: #1d4ed8; border: 1px solid #dbeafe;
  }
  h1 { font-size: 1.75rem; margin: 0.75rem 0 0.5rem; text-align: center; }
  .sub { text-align: center; color: #475569; margin: 0; }
  .head-wrap { position: relative; margin-bottom: 2rem; }
  @media (min-width: 768px) {
    .head-wrap.has-arrows { padding-left: 6rem; padding-right: 6rem; }
  }
  .head { text-align: center; max-width: 40rem; margin: 0 auto; }
  .nav {
    display: none;
    position: absolute; right: 0; bottom: 0;
    align-items: center; gap: 0.5rem;
  }
  @media (min-width: 768px) {
    .nav { display: flex; }
  }
  .nav button {
    display: inline-flex; height: 2.5rem; width: 2.5rem; cursor: pointer;
    align-items: center; justify-content: center; border-radius: 9999px;
    border: 1px solid #e2e8f0; background: #fff; color: #334155;
  }
  .nav button:hover:not(:disabled) { border-color: #cbd5e1; background: #f8fafc; }
  .nav button:disabled {
    opacity: 0.35; cursor: default; pointer-events: none;
  }
  .nav svg { width: 1rem; height: 1rem; }
  /* Visibility on WRAPPERS — never on the grid (display:grid would win). */
  .mobile-wrap { display: block; }
  .desktop-wrap { display: none; }
  @media (min-width: 768px) {
    .mobile-wrap { display: none; }
    .desktop-wrap { display: block; }
  }
  .grid-home-open-campaigns {
    display: grid; gap: 1rem; grid-auto-rows: 1fr; align-items: stretch; justify-content: start;
  }
  .grid-home-open-campaigns > * { min-width: 0; width: 100%; height: 100%; }
  @media (max-width: 767px) {
    .grid-home-open-campaigns {
      grid-auto-flow: column;
      grid-auto-columns: minmax(16.5rem, 82vw);
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 0.25rem;
    }
    .grid-home-open-campaigns > * { scroll-snap-align: start; }
  }
  @media (min-width: 768px) {
    .grid-home-open-campaigns {
      grid-template-columns: repeat(var(--home-open-campaign-cols, 4), minmax(0, 1fr));
    }
  }
  .card {
    background: #fff; border: 1px solid #e2e8f0; border-radius: 1rem;
    overflow: hidden; display: flex; flex-direction: column; min-height: 22rem;
    box-shadow: 0 1px 2px rgba(15,23,42,0.06);
  }
  .cover {
    height: 9.5rem; background: linear-gradient(120deg, #94a3b8, #64748b 40%, #334155);
    position: relative;
  }
  .cover span {
    position: absolute; left: 0.75rem; bottom: 0.75rem;
    background: rgba(15,23,42,0.75); color: #fff; font-size: 0.7rem;
    padding: 0.2rem 0.5rem; border-radius: 999px; font-weight: 600;
  }
  .body { padding: 1rem 1rem 1.15rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
  .brand { font-size: 0.75rem; color: #64748b; font-weight: 600; }
  .title { font-size: 1.05rem; font-weight: 700; margin: 0; line-height: 1.3; }
  .desc { font-size: 0.875rem; color: #475569; margin: 0; flex: 1; }
  .meta { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .chip {
    font-size: 0.7rem; font-weight: 600; background: #f1f5f9; color: #334155;
    border-radius: 0.5rem; padding: 0.2rem 0.45rem;
  }
  .cta {
    margin-top: 0.5rem; display: inline-flex; justify-content: center;
    padding: 0.55rem 0.85rem; border-radius: 0.75rem; background: #0f172a; color: #fff;
    font-size: 0.8rem; font-weight: 650; text-decoration: none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="head-wrap has-arrows" id="headWrap">
      <div class="head">
        <span class="eyebrow">Νέες ευκαιρίες</span>
        <h1>Ανοιχτές καμπάνιες από brands</h1>
        <p class="sub" id="sub">Preview</p>
      </div>
      <div class="nav" id="nav" aria-hidden="false">
        <button type="button" id="prev" aria-label="Προηγούμενες καμπάνιες">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <button type="button" id="next" aria-label="Επόμενες καμπάνιες">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </div>
    <div class="mobile-wrap">
      <ul class="grid-home-open-campaigns" id="mobileGrid"></ul>
    </div>
    <div class="desktop-wrap">
      <ul class="grid-home-open-campaigns" id="desktopGrid"></ul>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const pageSize = Math.max(2, Math.min(8, Number(params.get("n") || 4)));
    const total = Math.max(pageSize, Math.min(16, Number(params.get("total") || 8)));
    const pageParam = Math.max(0, Number(params.get("page") || 0));
    const brands = ["Nova Beauty", "Aegean Coffee", "FitLab", "Urban Wear", "Green Basket", "Studio Lumen", "Helios Food", "Peak Active"];

    function cardHtml(i) {
      return `
        <li>
          <article class="card">
            <div class="cover" style="filter: hue-rotate(${i * 35}deg)"><span>Ανοιχτή</span></div>
            <div class="body">
              <div class="brand">${brands[i % brands.length]}</div>
              <h2 class="title">Καμπάνια ${i + 1}: Story + Reel</h2>
              <p class="desc">Δημιούργησε αυθεντικό περιεχόμενο για το launch. Budget και deliverables εμφανίζονται στην κάρτα.</p>
              <div class="meta">
                <span class="chip">Instagram</span>
                <span class="chip">€${150 + i * 40}</span>
              </div>
              <a class="cta" href="#">Δες την καμπάνια</a>
            </div>
          </article>
        </li>`;
    }

    document.getElementById("mobileGrid").innerHTML = Array.from({ length: total }, (_, i) => cardHtml(i)).join("");

    let page = Math.min(pageParam, Math.max(0, Math.ceil(total / pageSize) - 1));
    const totalPages = Math.ceil(total / pageSize);
    const showArrows = total > pageSize;

    function renderDesktop() {
      const start = page * pageSize;
      const slice = Array.from({ length: Math.min(pageSize, total - start) }, (_, j) =>
        cardHtml(start + j)
      ).join("");
      const grid = document.getElementById("desktopGrid");
      grid.innerHTML = slice;
      // Always N tracks while paging so cards never resize.
      grid.style.setProperty("--home-open-campaign-cols", String(pageSize));
      document.getElementById("sub").textContent =
        `N=${pageSize} · σύνολο ${total} · σελίδα ${page + 1}/${totalPages} · μία σειρά (χωρίς autoplay)`;
      const prev = document.getElementById("prev");
      const next = document.getElementById("next");
      const nav = document.getElementById("nav");
      if (!showArrows) {
        nav.style.display = "none";
        document.getElementById("headWrap").classList.remove("has-arrows");
      } else {
        prev.disabled = page <= 0;
        next.disabled = page >= totalPages - 1;
      }
    }

    document.getElementById("prev").addEventListener("click", () => {
      if (page > 0) { page -= 1; renderDesktop(); }
    });
    document.getElementById("next").addEventListener("click", () => {
      if (page < totalPages - 1) { page += 1; renderDesktop(); }
    });
    renderDesktop();
  </script>
</body>
</html>
